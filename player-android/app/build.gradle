import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signage = new Properties()
def signageFile = rootProject.file('signage.properties')
if (signageFile.exists()) signageFile.withInputStream { signage.load(it) }
def quoteBuildConfig = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.signage.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.signage.player'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'SUPABASE_URL', quoteBuildConfig(signage.getProperty('SUPABASE_URL', ''))
        buildConfigField 'String', 'SUPABASE_ANON_KEY', quoteBuildConfig(signage.getProperty('SUPABASE_ANON_KEY', ''))
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
