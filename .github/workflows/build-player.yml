name: Build Android TV player

on:
  push:
    branches: [main]
    paths:
      - 'player-android/**'
      - '.github/workflows/build-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure player
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > player-android/signage.properties
      - name: Assemble debug APK
        run: gradle -p player-android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: signage-player-debug-apk
          path: player-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
